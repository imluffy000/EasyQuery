name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real secrets come from the environment at deploy time.
  ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  LLM_PROVIDER: echo

jobs:
  backend-quality:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check app tests evaluation
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app tests evaluation
      - name: MyPy
        working-directory: backend
        run: mypy app
        # Type coverage is being tightened incrementally; do not block on it yet.
        continue-on-error: true

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot_dev_password
          POSTGRES_DB: copilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://copilot:copilot_dev_password@localhost:5432/copilot
      REDIS_URL: redis://localhost:6379/0
      TEST_PG_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Seed the demo database
        env:
          PGPASSWORD: copilot_dev_password
        run: |
          psql -h localhost -U copilot -d copilot -f infra/postgres/01-init.sql
          psql -h localhost -U copilot -d postgres -f infra/postgres/02-seed-demo.sql

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Unit tests
        working-directory: backend
        run: pytest tests/unit -q --cov=app --cov-report=term-missing

      - name: Integration tests
        working-directory: backend
        run: pytest tests/integration -q

      - name: Agent evaluation
        working-directory: backend
        # Exits non-zero only if a security case regresses.
        run: python -m evaluation.run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: db-copilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: db-copilot-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build postgres redis backend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; docker compose logs backend; exit 1
      - name: Readiness probe reports all dependencies healthy
        run: |
          body=$(curl -sf http://localhost:8000/api/v1/ready)
          echo "$body"
          echo "$body" | grep -q '"status":"ready"'
      - name: Tear down
        if: always()
        run: docker compose down -v
