[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "db-copilot-backend"
version = "0.1.0"
description = "AI Database Copilot - natural language analytics over your databases"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "sqlglot>=25.30.0",
    "pgvector>=0.3.6",
    "langgraph>=0.2.50",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
# S101: pytest needs bare assert. B008: FastAPI's Depends() in defaults is the
# documented idiom, not a mutable-default bug.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
# S105/S106/S107 fire on the literal "access"/"refresh" passed as `token_type`.
# That names a token *kind*, not a secret; the real secret is JWT_SECRET, which
# is never a literal anywhere.
"app/security/auth.py" = ["S105", "S106", "S107"]
"app/api/v1/auth.py" = ["S106"]
"app/schemas/api.py" = ["S105"]
# N818 wants an "Error" suffix on exceptions. QueryTimeout and PermissionDenied
# read better at call sites and are already unambiguous as exception types.
"app/database/connectors/base.py" = ["N818"]
# The evaluation harness embeds the local demo database credentials by design;
# they are the same values committed in docker-compose.yml.
"evaluation/*" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the compose stack (postgres + redis) to be running",
]
